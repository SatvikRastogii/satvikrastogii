name: stats

# 04:23 UTC, deliberately off the top of the hour -- GitHub's shared runners
# queue hard at :00 and a scheduled job can sit there for twenty minutes.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Pull live counts from the GraphQL API
        env:
          # GITHUB_TOKEN cannot query contributionsCollection reliably.
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python src/fetch_stats.py --login satvikrastogii

      - name: Rebuild all six SVGs
        run: python src/build.py

      - name: Rewrite README.md with fresh cache-busters
        run: python src/build.py --readme

      - name: Verify before committing
        run: python src/verify.py --offline

      - name: Commit if anything actually changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stats.json assets README.md
          if git diff --cached --quiet; then
            echo 'nothing changed; not committing'
            exit 0
          fi
          git commit -m "stats: refresh live counts and regenerate SVGs"
          git push
