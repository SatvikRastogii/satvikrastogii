name: rotate

# Monday morning. The profile changes personality once a week:
# truck art -> terminal -> contribution squares -> truck art.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Advance the active variant and rewrite the README
        # The choice is stored in data/stats.json, which stats.py reads back
        # rather than overwriting, so the daily job cannot undo this.
        run: python src/build.py --rotate --readme

      - run: python src/verify.py --offline

      - name: Commit if anything actually changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stats.json README.md
          if git diff --cached --quiet; then
            echo 'nothing changed; not committing'
            exit 0
          fi
          ACTIVE=$(python -c "import json;print(json.load(open('data/stats.json'))['active_variant'])")
          git commit -m "rotate: active theme is now ${ACTIVE}"
          git push
