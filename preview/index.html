<!doctype html>
<meta charset="utf-8">
<title>profile render harness</title>
<style>
  body{margin:0;font:12px ui-monospace,monospace;background:#161b22;color:#8b949e}
  h2{font:600 12px ui-monospace,monospace;margin:0;padding:9px 14px;color:#c9d1d9;
     border-bottom:1px solid #30363d;position:sticky;top:0;background:#0d1117;z-index:3}
  h2 b{color:#3fb950} h2 i{color:#8b949e;font-style:normal;font-weight:400}
  .row{display:flex;align-items:flex-start}
  .pane{flex:1 1 0;min-width:0;border-right:1px solid #30363d}
  .pane.light{background:#ffffff} .pane.dark{background:#0d1117}
  .col{padding:14px;display:flex;justify-content:center}
  .w830 img,.w830 object{width:830px;max-width:100%;display:block}
  .w380 img,.w380 object{width:380px;display:block}
  .label{padding:5px 12px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
         background:#00000022;color:#8b949e}
  .pane.light .label{color:#59636e;background:#00000008}
</style>
<h2><b>render harness</b> &nbsp;<i>&lt;img&gt; panes = the restricted context GitHub uses (static composition).
  &lt;object&gt; panes = same file with a live SMIL clock (motion review).
  Rasterisers sample SMIL at t=0, so an &lt;img&gt; pane must already look finished.</i></h2>
<div id="out"></div>
<script>
  const variants = ["terminal","contrib","truckart"];
  const out = document.getElementById("out");
  const v = "?c=" + Date.now();
  for (const name of variants) {
    for (const w of ["w830","w380"]) {
      for (const tag of ["img","object"]) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = ["light","dark"].map(t => {
          const src = `../assets/${name}/${name}-${t}.svg` + v;
          const el = tag === "img"
            ? `<img alt="${name} ${t}" src="${src}">`
            : `<object type="image/svg+xml" data="${src}"></object>`;
          return `<div class="pane ${t}">
            <div class="label">${name} &middot; ${t} &middot; ${w.slice(1)}px &middot; ${tag}</div>
            <div class="col ${w}">${el}</div></div>`;
        }).join("");
        out.appendChild(row);
      }
    }
  }
</script>
